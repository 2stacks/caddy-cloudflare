# Builds the Dockerfile and pushes it to ghcr.io/2stacks/caddy-cloudflare.
# PRs: build + smoke test only (nothing is pushed).
# main: build, smoke test, push tags <caddy>-cf<plugin> and <caddy>, sign the
# digest with cosign (keyless, GitHub OIDC).
name: build

on:
  pull_request:
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  push:
    branches: [main]
    paths:
      - Dockerfile
      - .github/workflows/build.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/2stacks/caddy-cloudflare
  CONTEXT: .

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write   # push to GHCR (main only)
      id-token: write   # cosign keyless signing (main only)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # don't leave the job token in .git/config

      - name: Read versions from the Dockerfile
        id: v
        run: |
          caddy=$(sed -nE 's/^FROM caddy:([0-9]+\.[0-9]+\.[0-9]+)-builder@.*/\1/p' "$CONTEXT/Dockerfile")
          plugin=$(sed -nE 's/.*caddy-dns\/cloudflare@v([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' "$CONTEXT/Dockerfile")
          runtime=$(sed -nE 's/^FROM caddy:([0-9]+\.[0-9]+\.[0-9]+)@.*/\1/p' "$CONTEXT/Dockerfile")
          test -n "$caddy" && test -n "$plugin" || { echo "::error::could not parse versions"; exit 1; }
          test "$caddy" = "$runtime" || { echo "::error::builder $caddy != runtime $runtime"; exit 1; }
          echo "caddy=$caddy" >> "$GITHUB_OUTPUT"
          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "Caddy $caddy, caddy-dns/cloudflare v$plugin"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ env.CONTEXT }}
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          provenance: false
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.caddy }}-cf${{ steps.v.outputs.plugin }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.caddy }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.caddy }}-cf${{ steps.v.outputs.plugin }}
            org.opencontainers.image.description=Caddy ${{ steps.v.outputs.caddy }} with caddy-dns/cloudflare v${{ steps.v.outputs.plugin }}

      - name: Smoke test (version + cloudflare module)
        run: |
          ref="${IMAGE}:${{ steps.v.outputs.caddy }}"
          [ "${{ github.event_name }}" = pull_request ] || ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run --rm "$ref" caddy version
          docker run --rm "$ref" caddy list-modules | grep -qx 'dns.providers.cloudflare'

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: github.event_name != 'pull_request'

      - name: Sign the digest (keyless)
        if: github.event_name != 'pull_request'
        run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"

      - name: Summary
        run: |
          {
            echo "### ${IMAGE}"
            echo "- Caddy ${{ steps.v.outputs.caddy }}, caddy-dns/cloudflare v${{ steps.v.outputs.plugin }}"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Pushed: ${{ github.event_name != 'pull_request' }}"
          } >> "$GITHUB_STEP_SUMMARY"
